
# ═══════════════════════════════════════════════════
#  SERVICES = each container that will run
# ═══════════════════════════════════════════════════
services:


  # ─────────────────────────────────────────────────
  # SERVICE 1: app
  # This is your Laravel PHP application container
  # Built using our custom Dockerfile
  # ─────────────────────────────────────────────────
  app:
    build:
      context: .              # Look for Dockerfile in current directory
      dockerfile: Dockerfile  # Use this Dockerfile
    container_name: laratodo_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Bind mount: sync your local code into the container
      # Any change you make locally reflects immediately inside container
      - .:/var/www/html
    networks:
      - laratodo_network
    depends_on:
      - db   # Wait for db container to start before app

  # ─────────────────────────────────────────────────
  # SERVICE 2: nginx
  # Web server that receives browser requests
  # and forwards PHP requests to the app container
  # ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine       # Use official lightweight Nginx image
    container_name: laratodo_nginx
    restart: unless-stopped
    ports:
      # PORT MAPPING: localhost:8080 → container port 80
      # You visit http://localhost:8080 in your browser
      - "8080:80"
    volumes:
      # Sync your Laravel code so Nginx can serve static files
      - .:/var/www/html
      # Mount our custom Nginx config (tells Nginx how to handle PHP)
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laratodo_network
    depends_on:
      - app  # Nginx needs app to be running first

  # ─────────────────────────────────────────────────
  # SERVICE 3: db
  # MySQL database container
  # All your todo data is stored here
  # ─────────────────────────────────────────────────
  db:
    image: mysql:8.0          # Use official MySQL 8.0 image
    container_name: laratodo_db
    restart: unless-stopped
    environment:
      # These variables configure your MySQL database
      MYSQL_DATABASE: laratodo_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: laratodo_user
      MYSQL_PASSWORD: laratodo_pass
    volumes:
      # Named volume: MySQL data is stored here permanently
      # Even if you restart containers, your data stays safe
      - db_data:/var/lib/mysql
    ports:
      # PORT MAPPING: lets you connect from your MySQL client (TablePlus, etc.)
      # localhost:3306 → container port 3306
      - "3306:3306"
    networks:
      - laratodo_network

# ═══════════════════════════════════════════════════
#  VOLUMES = persistent storage managed by Docker
#  db_data persists MySQL data between restarts
# ═══════════════════════════════════════════════════
volumes:
  db_data:
    driver: local

# ═══════════════════════════════════════════════════
#  NETWORKS = internal communication between containers
#  All 3 services are on the same network so they
#  can reach each other by service name (app, db, nginx)
# ═══════════════════════════════════════════════════
networks:
  laratodo_network:
    driver: bridge

server {
    # Nginx listens on port 80 inside the container
    listen 80;

    # Root directory where Laravel's public folder is
    # All web traffic starts from /public/index.php
    root /var/www/html/public;

    # Default file to serve
    index index.php index.html;

    # Server name (localhost for local dev)
    server_name localhost;

    # ─────────────────────────────────────────────
    # Handle all incoming requests
    # Try to find the file → if not found → send to index.php
    # This is how Laravel's routing works
    # ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─────────────────────────────────────────────
    # Handle PHP files
    # Forward PHP requests to the app container (PHP-FPM)
    # using FastCGI protocol on port 9000
    # ─────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass app:9000;   # "app" = service name in docker-compose.yml
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ─────────────────────────────────────────────
    # Deny access to .htaccess files
    # ─────────────────────────────────────────────
    location ~ /\.ht {
        deny all;
    }

    # ─────────────────────────────────────────────
    # Error and access logs inside the container
    # ─────────────────────────────────────────────
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
